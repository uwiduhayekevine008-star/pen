name: Python safety checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-scope-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimum runtime dependencies
        run: python -m pip install "aiohttp>=3.9.0" "fastapi>=0.104.0" "uvicorn>=0.24.0" "pydantic>=2.5.0"
      - name: Compile project sources
        run: python -m compileall -q main.py scanner.py vulnscanner
      - name: Run scope and security helper tests
        run: python -m unittest discover -s tests -v
